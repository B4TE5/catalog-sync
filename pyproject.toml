[project]
name = "vinted-hunter"
version = "0.1.0"
description = "Cazador local de sudaderas en Vinted"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.2",
    "curl-cffi",
    "imagehash",
    "numpy>=2.5.4",
    "opencv-python-headless",
    "pillow",
    "pydantic",
    "pyyaml",
    "qrcode>=8.2",
    "rich",
    "typer",
    "tzdata>=2026.6",
    "unidecode",
    "zxing-cpp",
]

[project.scripts]
vh = "vinted_hunter.cli:app"

[dependency-groups]
dev = [
    "playwright==1.64.1",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not browser'"
markers = [
    "live: consulta Vinted real sin iniciar sesión",
    "browser: WebKit con emulación de iPhone contra Pages real",
]
