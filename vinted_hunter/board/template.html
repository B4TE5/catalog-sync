<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Vinted Hunter · Radar local</title>
<style>
:root{color-scheme:dark;font:16px/1.5 system-ui,sans-serif;background:#0e1214;color:#edf3f1;
  --panel:#171d20;--line:#2e383b;--muted:#a9b6b7;--accent:#baf296;--warm:#ffcc84}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1260px;margin:auto;padding:clamp(16px,4vw,54px)}
header{padding:clamp(22px,5vw,52px);background:linear-gradient(125deg,#202e2b,#13191d 70%);
  border:1px solid var(--line);border-radius:25px;display:grid;gap:18px}
h1,h2,p{margin:0}
h1{font-size:clamp(2.2rem,6vw,4.8rem);letter-spacing:-.07em;line-height:1}
h2{font-size:1.2rem;line-height:1.25}
.eyebrow{font-weight:750;color:var(--accent);letter-spacing:.15em;font-size:.76rem;text-transform:uppercase}
.muted{color:var(--muted)}
.heartbeat{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.health,.chip,.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;
  background:#263034;font-size:.78rem;font-weight:650}
.health::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:currentColor}
.healthy{color:var(--accent)} .degraded,.unknown{color:var(--warm)} .unhealthy{color:#ffa7a2}
.controls{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;margin:24px 0}
.filters,.selects,.chips{display:flex;flex-wrap:wrap;gap:8px}
button,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);
  padding:8px 12px;border-radius:12px;cursor:pointer;min-height:42px}
button[aria-pressed=true]{background:var(--accent);color:#182218;border-color:var(--accent);font-weight:750}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:15px;margin-top:12px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.media{position:relative;background:#242c30;aspect-ratio:4/3}
.media img{width:100%;height:100%;object-fit:cover;display:block}
.photo-controls{position:absolute;inset:auto 8px 8px;display:flex;justify-content:space-between;align-items:center}
.photo-controls span,.photo-controls button{background:#151a1bd9;color:white}
.photo-controls span{border-radius:999px;padding:2px 8px}
.content{display:grid;gap:10px;padding:16px}
.money{font-size:1.8rem;letter-spacing:-.04em;font-weight:760}
.badge{justify-self:start;color:var(--accent)} .rejected .badge{color:#ffa7a2}
a.open{display:block;text-align:center;border-radius:11px;padding:9px;background:var(--accent);
  color:#182218;text-decoration:none;font-weight:750}
a.open:hover{background:#d5fbbf}
summary{cursor:pointer;color:var(--muted)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.4 ui-monospace,monospace}
.empty{padding:30px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}
@media(max-width:520px){.controls,.selects{width:100%}.selects select{flex:1;min-width:0}.controls{margin:16px 0}}
details ul{padding-left:1.2rem} details td, details th{padding:.2rem .4rem;text-align:left}
</style>
</head>
<body>
<main>
<header>
  <p class="eyebrow">Radar local de segunda mano</p>
  <h1>Vinted Hunter</h1>
  <div class="heartbeat"><span class="health" id="health"></span><p class="muted" id="heartbeat"></p></div>
  <p class="muted" id="incident" hidden></p>
</header>
<div class="controls">
  <nav class="filters" id="tiers" aria-label="Nivel del anuncio"></nav>
  <div class="selects">
    <select id="brand" aria-label="Marca"><option value="">Todas las marcas</option></select>
    <select id="sort" aria-label="Orden"><option value="score">Mayor puntuación</option>
      <option value="recent">Más recientes</option><option value="median">% bajo la mediana</option></select>
  </div>
</div>
<p class="muted" id="count" aria-live="polite"></p>
<section id="cards" aria-label="Anuncios"></section>
<button id="more" hidden>Cargar más</button>
</main>
<script type="application/json" id="payload">__VH_DATA__</script>
<script>
"use strict";
const data = JSON.parse(document.querySelector("#payload").textContent);
const node = (tag, text, klass) => {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (klass) element.className = klass;
  return element;
};
const tiers = {all:"Todos", top:"🔥 Top", good:"✅ Buenas", maybe:"👀 Revisar", low:"Bajas",
               rejected:"⛔ Descartados", pending:"Pendientes"};
const reasons = {category:"Categoría incompatible",price:"Precio fuera de rango",size:"Talla distinta",hood:"Capucha incompatible",
  status:"Estado excluido",replica:"Texto de réplica",color:"Color distinto",photos:"Pocas fotos",
  seller_feedback:"Pocas valoraciones",seller_rating:"Nota de vendedor baja",
  fake_certilogo_domain:"Dominio QR ajeno a Certilogo",blacklisted_photo:"Foto en lista negra",
  shared_photo:"Foto de otro vendedor",relisted:"Resubida sin bajada de precio"};
const health = document.querySelector("#health");
health.textContent = {healthy:"Operativo", degraded:"Revisar", unhealthy:"No operativo",
                      unknown:"Sin comprobación"}[data.health];
health.classList.add(data.health);
const minutesSince = date => Math.max(0, Math.floor((Date.now() - new Date(date)) / 60000));
let heartbeat = "A la espera de la primera pasada";
if (data.run?.pending_only) {
  const pending = data.listings.filter(row => !row.tier).length;
  heartbeat = `Limpieza hace ${minutesSince(data.run.end)} min · ${data.run.enriched} fichas · ${pending} pendientes`;
} else if (data.run) {
  heartbeat = `Última pasada hace ${minutesSince(data.run.end)} min · ${data.run.seen} vistos · ${data.run.new} ${data.run.new === 1 ? "nuevo" : "nuevos"}`;
}
document.querySelector("#heartbeat").textContent = heartbeat;
if (data.run?.errors?.length) {
  const incident = document.querySelector("#incident");
  incident.hidden = false;
  incident.textContent = data.run.errors.join(" · ");
}
const brand = document.querySelector("#brand");
for (const [id, name] of Object.entries(data.brands)) {
  const option = node("option", name);
  option.value = id;
  brand.append(option);
}
Object.assign(reasons, {
  not_sweatshirt: "Prenda ajena a la categoría de sudaderas",
  too_cheap_for_brand: "Precio por debajo del suelo de la marca",
  catalog_photos_only: "Fotos de catálogo sin suficientes fotos propias",
  labelled_fake: "Marcado como falso",
  knitwear: "Prenda de punto o lana", profile_disabled: "Perfil desactivado",
  listing_unavailable: "Ficha no disponible · HTTP 404"
});
const gates = {
  garment:"Tipo de prenda", price:"Precio y moneda", size:"Talla", hood:"Capucha",
  color:"Color", status:"Condición", replica:"Texto de réplica", photos:"Mínimo de fotos",
  brand_rules:"Reglas de marca", seller_feedback:"Valoraciones del vendedor",
  seller_rating:"Nota del vendedor", fake_certilogo_domain:"Dominio del QR",
  catalog_photos_only:"Fotos propias", too_cheap_for_brand:"Suelo de precio y Certilogo",
  blacklisted_photo:"Lista negra de fotos", shared_photo:"Foto compartida",
  knitwear:"Tejido compatible con una sudadera", profile_disabled:"Perfil activo",
  listing_unavailable:"Ficha disponible"
};
const signals = {
  base:"Base", certilogo_ok:"Dominio Certilogo", qr_detected_unreadable:"QR sin lectura",
  seller_high:"Vendedor con trayectoria", seller_medium:"Valoraciones del vendedor",
  diverse:"Armario variado", same_brand:"Concentración de la marca", many_new:"Prendas nuevas",
  very_good:"Muy buen estado", new_without_tags:"Nuevo sin etiquetas",
  satisfactory:"Estado satisfactorio", cheap_new:"Nuevo a precio bajo", motivated:"Vendedor motivado",
  proof:"Prueba de compra", wear:"Desgaste", short_description:"Descripción breve",
  many_photos:"Cantidad de fotos", parts:"Partes de autenticación", stock_photo:"Foto de catálogo",
  price_drop:"Bajada de precio", bargain:"Cuartil inferior", hood_unconfirmed:"Capucha sin confirmar",
  authenticity_mentioned:"Autenticación mencionada"
};
function decision(row) {
  const trace = row.trace;
  const details = node("details");
  details.append(node("summary", "¿Por qué?"));
  const checks = node("ul");
  const passed = trace.gates_passed || [];
  for (const [key, label] of Object.entries(gates)) {
    const failed = key === trace.gate_rejected || (key === "garment" && ["not_sweatshirt", "knitwear"].includes(trace.gate_rejected));
    const symbol = failed ? "❌ " : passed.includes(key) ? "✅ " : passed.includes(key + "_unconfirmed") ? "⚪ " : "— ";
    checks.append(node("li", symbol + label));
  }
  details.append(checks);
  if (trace.score && row.tier && row.tier !== "rejected") {
    const table = node("table");
    const head = node("tr");
    head.append(node("th","Señal"),node("th","Puntos"));
    table.append(head);
    for (const [key, points] of Object.entries(trace.score.points)) {
      const line = node("tr");
      line.append(node("td", signals[key] || key), node("td", String(points)));
      table.append(line);
    }
    const total = node("tr");
    total.append(node("th","Total"),node("th",String(trace.score.score)));
    table.append(total);
    details.append(table);
  }
  const evidence = trace.evidence || {};
  const qr = {certilogo_ok:"Dominio Certilogo",qr_detected_unreadable:"Detectado sin lectura",
              qr_foreign_domain:"Dominio ajeno",none:"Sin señal"};
  details.append(node("p", "Visión · QR: " + (qr[evidence.qr] || "Sin evaluar") +
    " · Foto de catálogo: " + (evidence.stock_photo ? "Sí" : "Sin señal") +
    " · Compartida: " + (evidence.shared_photo ? "Sí" : "Sin señal")));
  if (trace.seller) details.append(node("p", "Vendedor · " +
    (trace.seller.feedback_count ?? "—") + " valoraciones · Nota " + (trace.seller.rating ?? "—")));
  if (trace.wardrobe) details.append(node("p", "Armario · " + trace.wardrobe.reviewed +
    " revisados · " + trace.wardrobe.same_brand + " de la marca · " + trace.wardrobe.new_with_tags +
    " con etiquetas"));
  const phrases = Object.values(trace.text || {}).flat();
  if (phrases.length) details.append(node("p", "Frases detectadas · " + [...new Set(phrases)].join(", ")));
  if (trace.timing) details.append(node("p", (trace.timing.age_estimated ? "Primera observación (edad estimada)" :
    "Hora indicada en la ficha") + " · Hace " + minutesSince(row.body.uploaded_at || row.body.first_seen) + " min"));
  const technical = node("details");
  technical.append(node("summary","Ver datos técnicos"),node("pre",JSON.stringify(trace,null,2)));
  details.append(technical);
  return details;
}
const euro = new Intl.NumberFormat("es-ES", {style:"currency", currency:"EUR"});
const tierOf = row => row.tier || "pending";
const closedLabels = {sold:"Vendido", reserved:"Reservado", gone:"Ya no disponible", hidden:"Oculto"};
const closed = row => Object.hasOwn(closedLabels, row.body.availability);
tiers.sold = "Vendidos";
tiers.negotiable = "Negociables";
const eligible = row => row.tier && row.tier !== "rejected";
const negotiable = row => eligible(row) && row.body.availability === "active" &&
  minutesSince(row.body.uploaded_at || row.body.first_seen) >= (data.negotiable_days || 7) * 1440;
function matchesTab(row, id) {
  if (id === "sold") return closed(row) && eligible(row);
  if (closed(row) && eligible(row)) return false;
  if (id === "all") return eligible(row);
  if (id === "negotiable") return negotiable(row);
  if (id === "top" || id === "good") return tierOf(row) === id && row.body.availability === "active";
  return tierOf(row) === id;
}
const feedbackSummary = node("p", undefined, "muted");
document.querySelector("#cards").before(feedbackSummary);
const salesSummary = node("section");
salesSummary.append(node("h2", "Ventas observadas"));
for (const [profile, sale] of Object.entries(data.sales || {})) {
  salesSummary.append(node("p", `${data.brands[profile] || profile} · ${sale.count} vendidos · ` +
    (sale.mean_minutes == null ? "Duración sin intervalo observado" :
      `Media estimada ${sale.mean_minutes} min (${sale.timed_count} transiciones)`), "muted"));
  for (const [price, values] of Object.entries(sale.by_price))
    salesSummary.append(node("p", `${euro.format(Number(price))} anunciados · ${values.count} vendidos · ` +
      (values.mean_minutes == null ? "Sin duración medida" : `Media estimada ${values.mean_minutes} min`), "muted"));
}
document.querySelector("#more").after(salesSummary);
let active = "all";
const pageSize = 48;
let limit = pageSize;
function gallery(listing, photos) {
  const figure = node("div", undefined, "media");
  const img = node("img");
  img.alt = listing.title;
  img.loading = "lazy";
  img.referrerPolicy = "no-referrer";
  let index = 0;
  img.src = photos[index];
  figure.append(img);
  if (photos.length > 1) {
    const controls = node("div", undefined, "photo-controls");
    const prev = node("button", "‹");
    const next = node("button", "›");
    prev.setAttribute("aria-label", "Foto anterior");
    next.setAttribute("aria-label", "Foto siguiente");
    const count = node("span", `1 / ${photos.length}`);
    count.setAttribute("aria-live", "polite");
    function move(step) {
      index = (index + step + photos.length) % photos.length;
      img.src = photos[index];
      count.textContent = `${index + 1} / ${photos.length}`;
    }
    prev.onclick = () => move(-1);
    next.onclick = () => move(1);
    controls.append(prev, count, next);
    figure.append(controls);
  }
  return figure;
}
function card(row) {
  const item = row.body;
  const {score, pricing, timing, seller, gate_rejected} = row.trace;
  const article = node("article", undefined, `card ${tierOf(row)}`);
  if (row.tier !== "rejected") article.append(gallery(item, row.display_photos || item.photos));
  const content = node("div", undefined, "content");
  content.append(node("span", data.brands[row.profile] || item.brand, "eyebrow"));
  content.append(node("h2", item.title));
  const sizeLabel = item.size || ({absent:"No indicada",unavailable:"No disponible"}[item.size_source] || "Pendiente de comprobar");
  content.append(node("p", `Talla · ${sizeLabel}`, "chip"));
  if (!item.availability || item.availability === "unknown")
    content.append(node("p", "Disponibilidad pendiente de comprobar", "muted"));
  content.append(node("div", euro.format(Number(item.observed_sale_price || item.price)), "money"));
  content.append(node("span", `${closed(row) ? closedLabels[item.availability] : tiers[tierOf(row)]}${row.score == null ? "" : ` · ${row.score}/100`}`, "badge"));
  if (closed(row)) {
    content.append(node("p", "Último precio anunciado observado", "muted"));
    if (item.closed_observed_at) content.append(node("p", "Estado detectado: " + new Date(item.closed_observed_at).toLocaleString("es-ES"), "muted"));
    if (item.availability === "sold") {
      const lower = item.uploaded_at && item.last_active_at ? Math.max(0, Math.round((Date.parse(item.last_active_at)-Date.parse(item.uploaded_at))/60000)) : null;
      const upper = lower != null ? Math.max(lower, Math.round((Date.parse(item.closed_observed_at)-Date.parse(item.uploaded_at))/60000)) : null;
      content.append(node("p", lower == null ? "Duración hasta la venta sin intervalo observado" : `Venta entre ${lower} y ${upper} min desde la subida (estimado)`, "muted"));
    }
  }
  if (gate_rejected) {
    content.append(node("p", reasons[gate_rejected] || gate_rejected));
  } else if (row.tier && pricing && item.availability === "active") {
    content.append(node("p", `${pricing.estimated ? "Total estimado" : "Total"} · ${euro.format(Number(pricing.total))}`, "muted"));
    const medianDelta = row.display_under_median;
    if (medianDelta != null)
      content.append(node("p", `${Math.abs(medianDelta)} % ${medianDelta < 0 ? "sobre" : "bajo"} la mediana`, "muted"));
    if (medianDelta == null)
      content.append(node("p", "Sin datos de mercado suficientes (n=" + (row.market_samples ?? 0) + ")", "muted"));
    for (const flag of score.flags || []) content.append(node("p", flag, "chip"));
    content.append(node("p", pricing.buy_now ? "COMPRAR YA, no ofertes" :
      `Oferta sugerida · ${euro.format(Number(pricing.offer))}${row.backfill && pricing.negotiable ? " · Negociable" : ""}`));
    const age = minutesSince(item.uploaded_at || item.first_seen);
    content.append(node("p", `${timing.hot ? "🔥 " : ""}${timing.age_estimated ? "Visto por primera vez" : "Subido"} hace ${age} min`, "muted"));
    if (seller) content.append(node("p", [seller.feedback_count == null ? null : `${seller.feedback_count} valoraciones`,
      seller.rating, seller.country].filter(x => x != null).join(" · "), "muted"));
    const chips = node("div", undefined, "chips");
    for (const reason of score.reasons) chips.append(node("span", reason, "chip"));
    content.append(chips);
  }
  content.append(decision(row));
  const link = node("a", "Abrir en Vinted", "open");
  const url = new URL(item.url);
  if (url.protocol === "https:" && url.hostname === "www.vinted.es") {
    link.href = url.href;
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    content.append(link);
  }
  if (data.feedback_repo) {
    const feedback = node("div", undefined, "chips");
    for (const [label, description] of [["fake","Fake"],["good","Buena"],["meh","No me interesa"]]) {
      const button = node("a", description, "chip");
      const title = "label:" + row.id + ":" + label;
      button.href = "https://github.com/" + data.feedback_repo + "/issues/new?title=" + encodeURIComponent(title);
      button.target = "_blank";
      button.rel = "noopener noreferrer";
      feedback.append(button);
    }
    content.append(feedback);
  }
  article.append(content);
  return article;
}
const cards = document.querySelector("#cards");
const more = document.querySelector("#more");
const sort = document.querySelector("#sort");
function render() {
  const counts = brand.value ? data.feedback_counts?.by_profile?.[brand.value] : data.feedback_counts?.total;
  feedbackSummary.textContent = `Etiquetas · Fake ${counts?.fake || 0} · Buenas ${counts?.good || 0} · Meh ${counts?.meh || 0}`;
  const filtered = data.listings.filter(row => matchesTab(row, active) &&
    (!brand.value || row.profile === brand.value));
  const recent = row => Date.parse(row.body.uploaded_at || row.body.first_seen);
  filtered.sort((a, b) => sort.value === "recent" ? recent(b) - recent(a) :
    sort.value === "median" ? (b.display_under_median ?? -Infinity) -
      (a.display_under_median ?? -Infinity) : (b.score ?? -1) - (a.score ?? -1));
  document.querySelector("#count").textContent = `${filtered.length} anuncios`;
  cards.replaceChildren(...filtered.slice(0, limit).map(card));
  more.hidden = filtered.length <= limit;
  if (!filtered.length) cards.append(node("p", "Aún no hay anuncios para estos filtros.", "empty"));
}
for (const [id, label] of Object.entries(tiers)) {
  const count = data.listings.filter(row => matchesTab(row, id)).length;
  const button = node("button", `${label} · ${count}`);
  button.setAttribute("aria-pressed", String(active === id));
  button.onclick = () => {
    document.querySelector("#tiers [aria-pressed=true]").setAttribute("aria-pressed", "false");
    button.setAttribute("aria-pressed", "true");
    active = id;
    limit = pageSize;
    render();
  };
  document.querySelector("#tiers").append(button);
}
brand.onchange = sort.onchange = () => {limit = pageSize; render();};
more.onclick = () => {limit += pageSize; render();};
render();
</script>
</body>
</html>
